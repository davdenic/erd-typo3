<f:layout name="Admin" />

<f:section name="headline">
    <h1>ERD Generator</h1>
</f:section>

<f:section name="content">
    <f:flashMessages />

    <f:form action="generate" method="post">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">Configuration</h3>
            </div>
            <div class="panel-body">
                <div class="row">
                    <div class="col-xs-12 col-md-6">
                        <div class="form-group">
                            <label for="mode">Mode</label>
                            <f:form.select
                                name="mode"
                                id="mode"
                                options="{extension: 'By extension', tables: 'By table(s)'}"
                                value="extension"
                                class="form-control"
                            />
                        </div>

                        <div class="form-group" id="ext-select">
                            <label for="extensionKey">Extension</label>
                            <f:form.select
                                name="extensionKey"
                                id="extensionKey"
                                options="{extensionOptions}"
                                prependOptionLabel="-- Select extension --"
                                prependOptionValue=""
                                class="form-control"
                            />
                        </div>

                        <div class="form-group" id="table-select" style="display: none;">
                            <label for="tables">Tables</label>
                            <f:form.select
                                name="tables"
                                id="tables"
                                options="{allTableOptions}"
                                multiple="1"
                                size="12"
                                class="form-control"
                            />
                            <p class="help-block">Hold Ctrl/Cmd to select multiple tables</p>
                        </div>
                    </div>

                    <div class="col-xs-12 col-md-6">
                        <div class="form-group">
                            <label for="depth">Relationship depth</label>
                            <f:form.select
                                name="depth"
                                id="depth"
                                options="{0: '0 — selected tables only', 1: '1 — direct relations', 2: '2 — two hops (default)', 3: '3 — three hops', -1: 'Unlimited'}"
                                value="2"
                                class="form-control"
                            />
                        </div>

                        <div class="form-group">
                            <label for="lang">Label language</label>
                            <f:form.select
                                name="lang"
                                id="lang"
                                options="{de: 'Deutsch', en: 'English'}"
                                value="de"
                                class="form-control"
                            />
                        </div>

                        <div class="checkbox">
                            <label>
                                <f:form.hidden name="includeInternal" value="0" />
                                <f:form.checkbox name="includeInternal" value="1" />
                                Include internal TYPO3 fields (uid, pid, hidden, ...)
                            </label>
                        </div>

                        <div class="checkbox">
                            <label>
                                <f:form.hidden name="includeCoreTables" value="0" />
                                <f:form.checkbox name="includeCoreTables" value="1" checked="1" />
                                Include core tables (sys_category, sys_file_reference)
                            </label>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xs-12">
                        <button type="submit" class="btn btn-primary">
                            Generate ERD
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </f:form>

    <script>
        document.getElementById('mode')?.addEventListener('change', function() {
            document.getElementById('ext-select').style.display = this.value === 'extension' ? 'block' : 'none';
            document.getElementById('table-select').style.display = this.value === 'tables' ? 'block' : 'none';
        });
    </script>
</f:section>
