<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">

<f:layout name="Module" />
<f:section name="Content">

    <h1>ERD Generator</h1>

    <f:form action="generate" method="post">
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label for="mode">Mode</label>
                    <f:form.select
                        name="mode"
                        id="mode"
                        options="{extension: 'By extension', tables: 'By table(s)'}"
                        value="extension"
                        class="form-select"
                    />
                </div>

                <div class="form-group" id="ext-select">
                    <label for="extensionKey">Extension</label>
                    <f:form.select
                        name="extensionKey"
                        id="extensionKey"
                        options="{extensionOptions}"
                        prependOptionLabel="-- Select extension --"
                        prependOptionValue=""
                        class="form-select"
                    />
                </div>

                <div class="form-group" id="table-select" style="display: none;">
                    <label for="tables">Tables</label>
                    <f:form.select
                        name="tables"
                        id="tables"
                        options="{allTableOptions}"
                        multiple="1"
                        size="12"
                        class="form-select"
                    />
                    <div class="form-text">Hold Ctrl/Cmd to select multiple tables</div>
                </div>
            </div>

            <div class="col-sm-6">
                <div class="form-group">
                    <label for="depth">Relationship depth</label>
                    <f:form.select
                        name="depth"
                        id="depth"
                        options="{0: '0 — selected tables only', 1: '1 — direct relations', 2: '2 — two hops (default)', 3: '3 — three hops', -1: 'Unlimited'}"
                        value="2"
                        class="form-select"
                    />
                </div>

                <div class="form-group">
                    <label for="lang">Label language</label>
                    <f:form.select
                        name="lang"
                        id="lang"
                        options="{de: 'Deutsch', en: 'English'}"
                        value="de"
                        class="form-select"
                    />
                </div>

                <div class="form-check mt-3">
                    <f:form.hidden name="includeInternal" value="0" />
                    <f:form.checkbox name="includeInternal" value="1" id="includeInternal" class="form-check-input" />
                    <label class="form-check-label" for="includeInternal">Include internal TYPO3 fields (uid, pid, hidden, ...)</label>
                </div>

                <div class="form-check">
                    <f:form.hidden name="includeCoreTables" value="0" />
                    <f:form.checkbox name="includeCoreTables" value="1" checked="1" id="includeCoreTables" class="form-check-input" />
                    <label class="form-check-label" for="includeCoreTables">Include core tables (sys_category, sys_file_reference)</label>
                </div>

                <div class="form-check">
                    <f:form.hidden name="checkDb" value="0" />
                    <f:form.checkbox name="checkDb" value="1" id="checkDb" class="form-check-input" />
                    <label class="form-check-label" for="checkDb">Check DB population</label>
                </div>

                <div class="form-check">
                    <f:form.hidden name="includeEmpty" value="0" />
                    <f:form.checkbox name="includeEmpty" value="1" id="includeEmpty" class="form-check-input" />
                    <label class="form-check-label" for="includeEmpty">Include 0%-populated fields (when check DB is on)</label>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-primary">
                Generate ERD
            </button>
        </div>
    </f:form>

</f:section>
</html>
